<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 賽車遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🏎️ 2D 賽車大冒險</h1>
        <div class="info-board">
            <span>分數：<strong id="score">0</strong></span>
        </div>
        <canvas id="gameCanvas" width="300" height="450"></canvas>
        
        <div class="controls">
            <button id="leftBtn">⬅️ 左</button>
            <button id="rightBtn">➡️ 右</button>
        </div>
        <p class="instruction">電腦用 ⬅️ ➡️ 方向鍵 / 手機直接點擊按鈕</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
